schemaVersion: "2"
kind: mixin
name: dev-tools
displayName: Dev Tools
description: Shared development tooling

setup:
  install:
    - command: "apt-get update && apt-get install -y jq"
  files:
    - path: /home/agent/.claude/settings.json

permissions:
  network:
    allow:
      - mcp.expo.dev
      - stitch.googleapis.com
