url: https://oreliau.github.io/meditation-app
appId: meditation-app-github-pages
name: Principal meditation journey (GitHub Pages)
tags:
  - smoke
  - scheduled
  - web

---

- launchApp:
    clearState: true
- assertVisible: "Find your inner sanctuary"
- takeScreenshot: github-pages-01-welcome
- scrollUntilVisible:
    element:
      text: "Begin my journey"
    direction: DOWN
- tapOn: "Begin my journey"
- tapOn: "Ease stress & anxiety"
- tapOn: "Continue"
- tapOn: "Beginner"
- tapOn: "Continue"
- tapOn: "3 mins — Quick pause"
- tapOn: "Morning"
- tapOn: "Confirm my rhythm"
- tapOn: "Amber Dawn"
- tapOn: "Enter the Sanctuary"
- assertVisible: "Idle"
- takeScreenshot: github-pages-02-home
- tapOn:
    id: session-duration
- tapOn: "6 secs"
- tapOn: "Apply"
- tapOn:
    id: session-play
- assertVisible: "Running"
- takeScreenshot: github-pages-03-running
- extendedWaitUntil:
    visible: "Moment of stillness"
    timeout: 15000
- takeScreenshot: github-pages-04-completed
- tapOn:
    id: completion-done
- assertVisible: "Idle"
- tapOn: "Explore"
- assertVisible: "Today’s practice"
- assertVisible: "1 completed session"
- launchApp
- assertNotVisible: "Find your inner sanctuary"
