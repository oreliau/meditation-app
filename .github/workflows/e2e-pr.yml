name: E2E smoke (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  chromium:
    name: Chromium principal journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          mkdir -p artifacts
          pnpm web -- --port 8081 > artifacts/maestro-web-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8081/meditation-app >/dev/null && break
            sleep 1
          done
          mkdir -p artifacts/maestro
          curl -Ls https://get.maestro.mobile.dev | bash
          /home/runner/.maestro/bin/maestro start-device --platform web
          /home/runner/.maestro/bin/maestro test --platform web .maestro/web-principal-flow.yaml \
            --format junit --output artifacts/maestro/chromium.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-chromium
          path: artifacts/
          if-no-files-found: warn

  android:
    name: Android principal journey
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: curl -Ls https://get.maestro.mobile.dev | bash
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: >-
            adb install android/app/build/outputs/apk/debug/app-debug.apk &&
            /home/runner/.maestro/bin/maestro test .maestro/android-principal-flow.yaml
              --format junit --output artifacts/maestro/android.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-android
          path: artifacts/
          if-no-files-found: warn
