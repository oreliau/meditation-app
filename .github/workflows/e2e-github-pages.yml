name: Maestro GitHub Pages smoke

on:
  workflow_run:
    workflows: ["Deploy web app to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_DISABLE_WEBGPU: "1"

jobs:
  github-pages:
    name: GitHub Pages Chromium journey
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/maestro
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Wait for GitHub Pages deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location \
              -A "github-actions-pages-smoke" \
              https://oreliau.github.io/meditation-app/ | \
              grep -F "Find your inner sanctuary" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "GitHub Pages did not serve the new app within 60 seconds" >&2
          exit 1
      - name: Run deployed web journey
        run: |
          Xvfb :99 -screen 0 1280x768x24 >/tmp/maestro-xvfb.log 2>&1 &
          export DISPLAY=:99
          /home/runner/.maestro/bin/maestro start-device --platform web
          /home/runner/.maestro/bin/maestro test --platform web .maestro/web-github-pages-flow.yaml \
            --format junit --output artifacts/maestro/github-pages.xml \
            --test-output-dir artifacts/maestro/screenshots/github-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-github-pages-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
