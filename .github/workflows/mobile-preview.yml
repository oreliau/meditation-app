name: Mobile private preview

run-name: Mobile preview ${{ github.event.inputs.sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to preview (defaults to the workflow commit)
        required: false
        type: string

permissions:
  contents: read
  statuses: write

# A sleeping/offline Mac leaves the newest run queued. A later merge replaces
# obsolete queued work once the runner is available again.
concurrency:
  group: mobile-preview-main
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  # Use the manual SHA only for workflow_dispatch; pushes always preview the
  # commit that caused the workflow, which is the merge result on main.
  PREVIEW_SHA: ${{ github.event.inputs.sha || github.sha }}
  IOS_BUNDLE_IDENTIFIER: com.oreliaukmz.meditationapp
  ANDROID_PACKAGE_NAME: com.oreliaukmz.meditationapp
  PREVIEW_STATE_FILE: ${{ vars.PREVIEW_STATE_FILE || '~/.meditation-app/preview-runner-state.json' }}

jobs:
  # These jobs intentionally have no `needs` relationship: one store outage or
  # platform-specific failure must not prevent the other preview from running.
  ios:
    name: iOS TestFlight preview
    runs-on: [self-hosted, macOS, preview-runner]
    timeout-minutes: 60
    env:
      PREVIEW_PLATFORM: ios
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_SHA }}
          fetch-depth: 0

      - name: Set up Node and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Record requested commit
        env:
          PREVIEW_STATUS: requested
        run: ./scripts/update-preview-runner-state.rb

      - name: Report iOS preview started
        uses: actions/github-script@v7
        env:
          PREVIEW_STATUS_STATE: pending
          PREVIEW_STATUS_DESCRIPTION: iOS preview is queued on the Mac runner
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PREVIEW_SHA,
              state: process.env.PREVIEW_STATUS_STATE,
              context: 'mobile-preview / iOS',
              description: process.env.PREVIEW_STATUS_DESCRIPTION,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Build and upload iOS preview (up to three attempts)
        id: build
        continue-on-error: true
        env:
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/run-preview-with-retries.sh bundle exec fastlane ios preview

      - name: Record successful commit
        if: steps.build.outcome == 'success'
        env:
          PREVIEW_STATUS: succeeded
        run: ./scripts/update-preview-runner-state.rb

      - name: Record failed commit
        if: steps.build.outcome == 'failure'
        env:
          PREVIEW_STATUS: failed
        run: ./scripts/update-preview-runner-state.rb

      - name: Report iOS preview result
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_RESULT: ${{ steps.build.outcome == 'success' && 'success' || 'failure' }}
          PREVIEW_STATUS_DESCRIPTION: ${{ steps.build.outcome == 'success' && 'iOS preview uploaded to TestFlight' || 'iOS preview failed after three attempts; inspect workflow logs' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PREVIEW_SHA,
              state: process.env.PREVIEW_RESULT,
              context: 'mobile-preview / iOS',
              description: process.env.PREVIEW_STATUS_DESCRIPTION,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Notify iOS preview result
        if: always()
        env:
          PREVIEW_RESULT: ${{ steps.build.outcome == 'success' && 'succeeded' || 'failed' }}
        run: ruby scripts/notify-preview.rb

      - name: Summarize iOS preview result
        if: always()
        env:
          PREVIEW_RESULT: ${{ steps.build.outcome == 'success' && 'succeeded' || 'failed' }}
        run: echo "### iOS preview ${PREVIEW_RESULT}" >> "$GITHUB_STEP_SUMMARY" && echo "Commit: \`${PREVIEW_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail iOS job after retries
        if: steps.build.outcome == 'failure'
        run: exit 1

  android:
    name: Android Play Internal preview
    runs-on: [self-hosted, macOS, preview-runner]
    timeout-minutes: 60
    env:
      PREVIEW_PLATFORM: android
    steps:
      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_SHA }}
          fetch-depth: 0

      - name: Set up Node and pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Record requested commit
        env:
          PREVIEW_STATUS: requested
        run: ./scripts/update-preview-runner-state.rb

      - name: Report Android preview started
        uses: actions/github-script@v7
        env:
          PREVIEW_STATUS_STATE: pending
          PREVIEW_STATUS_DESCRIPTION: Android preview is queued on the Mac runner
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PREVIEW_SHA,
              state: process.env.PREVIEW_STATUS_STATE,
              context: 'mobile-preview / Android',
              description: process.env.PREVIEW_STATUS_DESCRIPTION,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Build and upload Android preview (up to three attempts)
        id: build
        continue-on-error: true
        env:
          PREVIEW_COMMIT: ${{ env.PREVIEW_SHA }}
          GOOGLE_PLAY_TRACK: internal
        run: ./scripts/run-preview-with-retries.sh bundle exec fastlane android preview

      - name: Record successful commit
        if: steps.build.outcome == 'success'
        env:
          PREVIEW_STATUS: succeeded
        run: ./scripts/update-preview-runner-state.rb

      - name: Record failed commit
        if: steps.build.outcome == 'failure'
        env:
          PREVIEW_STATUS: failed
        run: ./scripts/update-preview-runner-state.rb

      - name: Report Android preview result
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_RESULT: ${{ steps.build.outcome == 'success' && 'success' || 'failure' }}
          PREVIEW_STATUS_DESCRIPTION: ${{ steps.build.outcome == 'success' && 'Android preview uploaded to Google Play Internal Testing' || 'Android preview failed after three attempts; inspect workflow logs' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PREVIEW_SHA,
              state: process.env.PREVIEW_RESULT,
              context: 'mobile-preview / Android',
              description: process.env.PREVIEW_STATUS_DESCRIPTION,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Notify Android preview result
        if: always()
        env:
          PREVIEW_RESULT: ${{ steps.build.outcome == 'success' && 'succeeded' || 'failed' }}
        run: ruby scripts/notify-preview.rb

      - name: Summarize Android preview result
        if: always()
        env:
          PREVIEW_RESULT: ${{ steps.build.outcome == 'success' && 'succeeded' || 'failed' }}
        run: echo "### Android preview ${PREVIEW_RESULT}" >> "$GITHUB_STEP_SUMMARY" && echo "Commit: \`${PREVIEW_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail Android job after retries
        if: steps.build.outcome == 'failure'
        run: exit 1
