schemaVersion: "2"
kind: sandbox
name: claude-sonnet
extends: claude

credentials:
  - service: github
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: github.com
          scheme: bearer
  - service: claude
    oauth:
      tokenEndpoint:
        host: claude.ai
        path: /oauth/authorize
      passthrough: true

permissions:
  network:
    allow:
      - react.doctor
      - auth.openai.com
      - mcp.expo.dev
      - stitch.googleapis.com
      - expo.dev
      - www.unistyl.es
      - api.expo.dev
      - exp.host
      - cdp.exp.host
      - reactnative.directory
      - deb.nodesource.com
      - cdp.expo.dev

sandbox:
  command:
    - --dangerously-skip-permissions
    - --model
    - claude-sonnet-5
