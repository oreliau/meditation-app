schemaVersion: "2"
kind: sandbox
name: claude-sonnet
extends: claude

credentials:
  - service: github
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: github.com
          scheme: bearer

permissions:
  network:
    allow:
      - mcp.expo.dev
      - stitch.googleapis.com
      - expo.dev
      - www.unistyl.es
      - api.expo.dev
      - exp.host
      - cdp.exp.host
      - reactnative.directory
      - deb.nodesource.com
      - cdp.expo.dev

sandbox:
  command:
    - --dangerously-skip-permissions
    - --settings
    - /home/agent/.config/claude/sonnet.json
    - --model
    - claude-sonnet-5
