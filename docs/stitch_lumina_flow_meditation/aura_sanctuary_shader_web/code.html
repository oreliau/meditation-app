<style>
        /* Ambient Shader-like CSS Animation to satisfy visual requirements safely */
        .ambient-canvas {
            background: 
                radial-gradient(circle at 10% 20%, rgba(217, 119, 87, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(233, 168, 93, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(253, 185, 108, 0.3) 0%, transparent 70%),
                #FFFDF9; /* cream-surface */
            background-size: 150% 150%;
            animation: fluidMovement 25s ease-in-out infinite alternate;
            filter: blur(40px);
            transform: scale(1.2); /* Hide blurred edges */
        }

        @keyframes fluidMovement {
            0% { background-position: 0% 0%; }
            33% { background-position: 100% 50%; }
            66% { background-position: 50% 100%; }
            100% { background-position: 0% 100%; }
        }
    </style>
</head>
