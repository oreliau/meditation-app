<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_30 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_30" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_30');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 7.5);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Soft, warm, luminous lighting (Aura Sanctuary aesthetic)
const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.4);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffecd2, 2.2);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xd97757, 3.5, 20);
fillLight.position.set(-4, -2, 3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffd166, 3.0, 15);
rimLight.position.set(0, 4, -3);
scene.add(rimLight);

// Group holding our joyful 3D meditative trophy / badge
const trophyGroup = new THREE.Group();
scene.add(trophyGroup);

// Materials
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xf5b041,
  roughness: 0.25,
  metalness: 0.85,
});

const terracottaMat = new THREE.MeshStandardMaterial({
  color: 0xd97757,
  roughness: 0.35,
  metalness: 0.15,
});

const pearlMat = new THREE.MeshStandardMaterial({
  color: 0xfbf9f5,
  roughness: 0.15,
  metalness: 0.1,
});

const amberGlowMat = new THREE.MeshStandardMaterial({
  color: 0xffa94d,
  roughness: 0.2,
  metalness: 0.3,
  emissive: 0xd97757,
  emissiveIntensity: 0.25,
});

// 1. Central Glossy Orb (Mind/Core)
const coreGeo = new THREE.SphereGeometry(1.15, 64, 64);
const coreMesh = new THREE.Mesh(coreGeo, pearlMat);
trophyGroup.add(coreMesh);

// 2. Floating Golden Halos / Rings (Gyroscopic Meditative Halo like Airbnb/Duolingo 3D badges)
const torusGeo1 = new THREE.TorusGeometry(1.75, 0.08, 32, 100);
const torusMesh1 = new THREE.Mesh(torusGeo1, goldMat);
torusMesh1.rotation.x = Math.PI * 0.35;
trophyGroup.add(torusMesh1);

const torusGeo2 = new THREE.TorusGeometry(2.1, 0.06, 32, 100);
const torusMesh2 = new THREE.Mesh(torusGeo2, terracottaMat);
torusMesh2.rotation.y = Math.PI * 0.4;
torusMesh2.rotation.x = Math.PI * 0.15;
trophyGroup.add(torusMesh2);

// 3. Floating Sacred Lotus Petals surrounding the orb
const petalCount = 8;
const petalsGroup = new THREE.Group();
for (let i = 0; i < petalCount; i++) {
  const angle = (i / petalCount) * Math.PI * 2;
  const petalGeo = new THREE.ConeGeometry(0.35, 1.1, 32);
  const petalMesh = new THREE.Mesh(petalGeo, amberGlowMat);
  petalMesh.position.set(Math.cos(angle) * 1.5, Math.sin(angle) * 1.5, 0);
  petalMesh.rotation.z = angle - Math.PI / 2;
  petalMesh.scale.set(0.6, 1.0, 0.25);
  petalsGroup.add(petalMesh);
}
trophyGroup.add(petalsGroup);

// 4. Sparkle / Star burst particles floating around (Duolingo celebratory delight)
const sparkles = [];
const starGeo = new THREE.OctahedronGeometry(0.18, 0);
for (let i = 0; i < 18; i++) {
  const mat = (i % 3 === 0) ? goldMat : (i % 3 === 1 ? terracottaMat : pearlMat);
  const star = new THREE.Mesh(starGeo, mat);
  const radius = 2.4 + Math.random() * 1.2;
  const theta = Math.random() * Math.PI * 2;
  const phi = (Math.random() - 0.5) * Math.PI;
  star.position.set(
    radius * Math.cos(theta) * Math.cos(phi),
    radius * Math.sin(phi),
    radius * Math.sin(theta) * Math.cos(phi)
  );
  star.userData = {
    initialPos: star.position.clone(),
    speed: 1.0 + Math.random() * 2.0,
    rotSpeed: (Math.random() - 0.5) * 4.0,
    phase: Math.random() * Math.PI * 2
  };
  scene.add(star);
  sparkles.push(star);
}

// Mouse parallax interactivity
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  const rect = container.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  targetX = (x - 0.5) * 1.5;
  targetY = (y - 0.5) * 1.5;
});

// Responsive resize
function onResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// Animation Loop
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Smooth lerp mouse parallax
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;

  // Gentle floating & bounce (Duolingo-like friendly energetic breathing)
  trophyGroup.position.y = Math.sin(t * 1.8) * 0.15;
  trophyGroup.rotation.y = t * 0.5 + mouseX * 0.6;
  trophyGroup.rotation.x = Math.sin(t * 0.9) * 0.1 - mouseY * 0.6;

  // Independent halo rotations
  torusMesh1.rotation.z = t * 0.8;
  torusMesh1.rotation.x = Math.PI * 0.35 + Math.sin(t * 1.2) * 0.2;

  torusMesh2.rotation.z = -t * 0.6;
  torusMesh2.rotation.y = Math.PI * 0.4 + Math.cos(t * 1.1) * 0.2;

  // Petals breathing pulse
  const pulse = 1.0 + Math.sin(t * 2.4) * 0.08;
  petalsGroup.scale.set(pulse, pulse, pulse);
  petalsGroup.rotation.z = -t * 0.3;

  // Sparkles orbital dance
  sparkles.forEach((s) => {
    const d = s.userData;
    s.rotation.x += d.rotSpeed * 0.02;
    s.rotation.y += d.rotSpeed * 0.03;
    const offset = Math.sin(t * d.speed + d.phase) * 0.25;
    s.position.x = d.initialPos.x + Math.cos(t * 0.8 + d.phase) * 0.15;
    s.position.y = d.initialPos.y + offset;
    s.position.z = d.initialPos.z + Math.sin(t * 0.8 + d.phase) * 0.15;
  });

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_30 -->
</body>
</html>
