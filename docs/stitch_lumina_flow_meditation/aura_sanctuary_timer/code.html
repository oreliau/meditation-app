<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4); /* Light cream hint */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .progress-ring {
            animation: pulse-ring 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
        }
        .breathe-text {
            animation: breathe 8s ease-in-out infinite;
        }
    </style>

<body class="bg-background text-on-surface min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Immersive Layer -->
<div class="fixed inset-0 z-0">

<!-- Fallback Gradient/Overlay -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-bright/80 via-background/90 to-surface-container-low/90 pointer-events-none"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/40 border-b border-surface-variant/30 flex justify-between items-center px-container-padding-mobile py-4 transition-all duration-500 ease-in-out">
<button class="text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
</button>
<div class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md tracking-widest text-primary">Aura</div>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-container-padding-mobile pb-32 pt-24">
<!-- Breathing Prompt -->
<div class="mb-12 font-body-lg text-body-lg text-tertiary tracking-widest uppercase breathe-text" id="breathePrompt">
            Inhale
        </div>
<!-- Timer Circle -->
<div class="relative w-72 h-72 md:w-96 md:h-96 flex items-center justify-center">
<!-- Decorative Outer Rings -->
<div class="absolute inset-0 rounded-full border border-primary/20 progress-ring"></div>
<div class="absolute inset-4 rounded-full border border-tertiary/20"></div>
<!-- Core Timer Display -->
<div class="glass-panel w-full h-full rounded-full flex flex-col items-center justify-center shadow-[0_0_40px_rgba(217,119,87,0.15)] relative overflow-hidden">
<span class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tight">12:00</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-2 uppercase tracking-widest">Remaining</span>
<!-- Subtle internal progress indicator (decorative) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewbox="0 0 100 100">
<circle class="text-primary/40" cx="50" cy="50" fill="none" r="48" stroke="currentColor" stroke-dasharray="301" stroke-dashoffset="60" stroke-width="0.5"></circle>
</svg>
</div>
</div>
<!-- Controls -->
<div class="mt-16 flex items-center gap-8">
<button class="glass-panel w-16 h-16 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors duration-300">
<span class="material-symbols-outlined text-2xl" data-icon="restart_alt">restart_alt</span>
</button>
<button class="glass-panel w-20 h-20 rounded-full flex items-center justify-center text-primary ring-1 ring-primary/20 hover:bg-primary-container/10 transition-all duration-300 hover:scale-105 shadow-[0_0_30px_rgba(217,119,87,0.15)]">
<span class="material-symbols-outlined text-3xl" data-icon="pause" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="glass-panel w-16 h-16 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors duration-300">
<span class="material-symbols-outlined text-2xl" data-icon="volume_up">volume_up</span>
</button>
</div>

<script>
        // Simple breathing prompt logic
        const prompt = document.getElementById('breathePrompt');
        let isInhale = true;
        
        setInterval(() => {
            isInhale = !isInhale;
            prompt.style.opacity = '0';
            setTimeout(() => {
                prompt.textContent = isInhale ? 'Inhale' : 'Exhale';
                prompt.style.opacity = '1';
            }, 500); // Wait for fade out
        }, 4000); // Syncs roughly with the 8s breathe animation (4s in, 4s out)
    </script>
