<!DOCTYPE html><html lang="fr" style=""><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura - Lock Screen Widgets iOS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .font-serif-aura {
      font-family: 'Playfair Display', Georgia, serif;
    }
    /* iOS Lockscreen Clock font style */
    .ios-time {
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    /* Glassmorphic vibrant iOS widget style */
    .widget-glass {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.12), inset 0 0 0 0.5px rgba(255, 255, 255, 0.3);
    }
    .widget-glass-active {
      background: rgba(255, 255, 255, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-[#121118] text-white min-h-screen flex items-center justify-center p-0 md:p-6 lg:p-10">

  <!-- iPhone Frame Mockup -->
  <div class="relative w-full max-w-[420px] h-[890px] rounded-[55px] overflow-hidden shadow-[0_25px_70px_rgba(0,0,0,0.7),0_0_0_12px_#27252f,0_0_0_14px_#3f3c4c] flex flex-col justify-between p-6">
    
    <!-- Organic Ambient Wallpaper with warm Aura Sanctuary sunrise hues & deep twilight -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#1b1928] via-[#2d2238] to-[#6d4038] z-0"></div>
    <div class="absolute -top-32 -left-20 w-96 h-96 rounded-full bg-amber-400/20 blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 -right-24 w-80 h-80 rounded-full bg-rose-500/25 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-16 left-1/4 w-72 h-72 rounded-full bg-orange-400/20 blur-3xl pointer-events-none"></div>

    <!-- Status Bar & Dynamic Island -->
    <div class="relative z-20 pt-2 flex justify-between items-center px-4">
      <!-- Operator / Time (Hidden or small for lock screen top) -->
      <div class="flex items-center gap-1.5 text-xs tracking-tight font-medium text-white/80">
        <span class="material-symbols-outlined text-[15px]">lock</span>
      </div>

      <!-- Dynamic Island with Live Meditation indicator -->
      <div class="w-32 h-7 bg-black rounded-full flex items-center justify-between px-3 py-1 shadow-md border border-white/5">
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-[#d97757] animate-pulse"></span>
          <span class="text-[10px] font-medium tracking-wide text-white/90">Aura</span>
        </div>
        <div class="flex items-center gap-1 text-[10px] font-mono text-[#f6d5c2]">
          <span class="material-symbols-outlined text-[12px]">air</span>
          <span class="">4:20</span>
        </div>
      </div>

      <!-- System Icons -->
      <div class="flex items-center gap-1.5 text-white/80 text-xs">
        <span class="material-symbols-outlined text-[15px]">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-[15px]">wifi</span>
        <span class="material-symbols-outlined text-[17px]">battery_full</span>
      </div>
    </div>

    <!-- Lockscreen Main Hub: Date, Inline Widget, Time & Widgets Grid -->
    <div class="relative z-10 flex flex-col items-center mt-3 text-center">
      
      <!-- 1. INLINE WIDGET (Above Clock - iOS Standard) -->
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-xs font-medium text-white/90 shadow-sm mb-1.5 cursor-pointer hover:bg-white/15 transition-all">
        <span class="material-symbols-outlined text-[14px] text-[#ffab8f]">self_improvement</span>
        <span class="font-semibold text-white/95">Mardi 24 Oct.</span>
        <span class="text-white/40">•</span>
        <span class="text-[#fce0d4]">Série 7 jrs 🔥</span>
      </div>

      <!-- Big Lock Screen Clock (iOS 17/18 Elegance) -->
      <h1 class="ios-time text-[90px] font-bold tracking-tighter text-white drop-shadow-[0_4px_16px_rgba(0,0,0,0.3)] my-0 font-serif-aura">
        09:41
      </h1>

      <!-- 2. LOCK SCREEN WIDGETS ROW (Below Clock) -->
      <!-- Composed of 1 Rectangular Widget (2x1) + 2 Circular Widgets (1x1) -->
      

      <!-- 3. LIVE ACTIVITY BANNER (Dynamic Island / Lock Screen Activity iOS 17+) -->
      <div class="w-full mt-5 px-2">
        <div class="w-full rounded-[26px] bg-black/40 backdrop-blur-2xl border border-white/20 p-3.5 shadow-2xl text-left">
          
          <div class="flex items-center justify-between pb-2 border-b border-white/10">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded-lg bg-[#d97757] flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-[15px] text-white">spa</span>
              </div>
              <div>
                <p class="text-[12px] font-bold text-white tracking-wide">Aura • Session En Direct</p>
                <p class="text-[10px] text-white/60">Cohérence Cardiaque du Matin</p>
              </div>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#d97757]/30 text-[#ffc3b0] border border-[#d97757]/50">
              En cours
            </span>
          </div>

          <!-- Live Visualizer & Controls -->
          <div class="pt-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <!-- Breathing visual orb mini -->
              <div class="relative w-9 h-9 flex items-center justify-center">
                <div class="absolute inset-0 rounded-full bg-[#d97757]/30 animate-ping opacity-75"></div>
                <div class="relative w-7 h-7 rounded-full bg-gradient-to-br from-[#f2a890] to-[#d97757] flex items-center justify-center shadow-inner">
                  <span class="material-symbols-outlined text-[13px] text-[#331109]">air</span>
                </div>
              </div>
              <div>
                <div class="text-[13px] font-bold text-white tracking-wider font-mono">03:42 <span class="text-[10px] font-normal text-white/50">/ 05:00</span></div>
                <p class="text-[10px] text-[#ffd6c9] font-medium">Inspirez doucement...</p>
              </div>
            </div>

            <!-- Mini Audio / Pause buttons -->
            <div class="flex items-center gap-2">
              <button class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition-all">
                <span class="material-symbols-outlined text-[16px]">pause</span>
              </button>
              <button class="w-8 h-8 rounded-full bg-white/15 hover:bg-white/25 flex items-center justify-center text-white transition-all">
                <span class="material-symbols-outlined text-[16px]">volume_up</span>
              </button>
            </div>
          </div>

          <!-- Mini Progress Bar -->
          <div class="w-full bg-white/10 h-1.5 rounded-full mt-3 overflow-hidden">
            <div class="bg-gradient-to-r from-[#e79275] to-[#f4beab] h-full rounded-full" style="width: 72%;"></div>
          </div>

        </div>
      </div>

    </div>

    <!-- Bottom Lock Screen Controls: Flashlight, Camera & Home Indicator -->
    <div class="relative z-20 mt-auto pt-4 flex flex-col items-center">
      
      <!-- Lock Screen Shortcuts (Flashlight & Camera) -->
      <div class="w-full flex justify-between items-center px-4 mb-5">
        <button class="w-12 h-12 rounded-full bg-black/35 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white hover:bg-black/50 transition-all shadow-lg active:scale-95">
          <span class="material-symbols-outlined text-[20px]">flashlight_on</span>
        </button>

        <p class="text-[11px] font-medium text-white/50 tracking-wide">Balayer pour déverrouiller</p>

        <button class="w-12 h-12 rounded-full bg-black/35 backdrop-blur-xl border border-white/20 flex items-center justify-center text-white hover:bg-black/50 transition-all shadow-lg active:scale-95">
          <span class="material-symbols-outlined text-[20px]">photo_camera</span>
        </button>
      </div>

      <!-- iOS Home Bar Indicator -->
      <div class="w-36 h-1 bg-white/70 rounded-full mb-1"></div>
    </div>

  </div>





</body></html>
